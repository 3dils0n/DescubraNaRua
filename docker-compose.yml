services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: descubra_na_rua
    ports:
      - "5432:5432"
    volumes:
      - descubra_pg:/var/lib/postgresql/data

volumes:
  descubra_pg:
